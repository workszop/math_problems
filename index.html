<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zabawne zadania matematyczne dla dzieci</title>
  <!-- Using Bootstrap CSS for styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }
    .problem-card {
      margin-bottom: 1.5rem;
    }
    .problem-title {
      font-weight: bold;
      font-size: 1.25rem;
    }
    .interactive-input {
      margin-top: 0.5rem;
    }
    .help-section {
      border: 1px solid #ced4da;
      background: #e9ecef;
      padding: 10px;
      margin-top: 10px;
      display: none;
    }
    .help-buttons {
      margin-top: 10px;
      margin-bottom: 10px;
    }
    /* Custom header styles with different colors for each problem */
    .problem-header {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .problem-header-1 { background-color: #cce5ff; }   /* Painting - light blue */
    .problem-header-2 { background-color: #d4edda; }   /* Road Trip - light green */
    .problem-header-3 { background-color: #fff3cd; }   /* Farm Animals - light yellow */
    .problem-header-4 { background-color: #d1ecf1; }   /* Odd Shapes - light cyan */
    .problem-header-5 { background-color: #f8d7da; }   /* Fundraiser - light red */
    .problem-header-6 { background-color: #e2e3e5; }   /* Grocery Budget - light grey */
    .problem-header-7 { background-color: #e6e6fa; }   /* Carnival - lavender */
    .problem-header-8 { background-color: #fef9c3; }   /* Birdhouse - soft yellow */
    .problem-header-9 { background-color: #ffe4e1; }   /* Cookie Jar - misty rose */
    .problem-header-10 { background-color: #e0ffff; }  /* Garden Design - light cyan */
    .problem-header-11 { background-color: #f0e68c; }  /* Leaky Faucet - khaki */
    .problem-header-12 { background-color: #d3d3d3; }  /* School Bus - light grey */
    .problem-header-13 { background-color: #ffb6c1; }  /* Candy Jar - light pink */
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4" id="pageTitle">Ładowanie...</h1>
    <p id="pageDescription"></p>

    <div class="accordion" id="problemsAccordion">
      <!-- Problems will be loaded here dynamically -->
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application JavaScript -->
  <script>
    // Toggle content visibility
    function toggleContent(id) {
      const element = document.getElementById(id);
      if (element.style.display === "none" || element.style.display === "") {
        element.style.display = "block";
      } else {
        element.style.display = "none";
      }
    }

    // Calculator functions for different problem types
    const calculators = {
      fence: function(problemId) {
        const length = 32;
        const height = parseFloat(document.getElementById('fenceHeight').value);
        const resultElement = document.getElementById('fenceResult');

        if (isNaN(height) || height <= 0) {
          resultElement.innerText = "Proszę podać prawidłową wysokość.";
          return;
        }
        const area = length * height;
        resultElement.innerText = `Pomalujesz około ${area.toFixed(2)} metrów kwadratowych z jednej strony!`;
      },

      roadTrip: function(problemId) {
        const distance = parseFloat(document.getElementById('distance').value);
        const avgSpeed = parseFloat(document.getElementById('avgSpeed').value);
        const stopFrequency = parseFloat(document.getElementById('stopFrequency').value);
        const stopDuration = parseFloat(document.getElementById('stopDuration').value);
        const resultElement = document.getElementById('roadTripResult');

        if (isNaN(distance) || isNaN(avgSpeed) || avgSpeed <= 0 || isNaN(stopFrequency) || stopFrequency <= 0 || isNaN(stopDuration)) {
          resultElement.innerText = "Proszę podać prawidłowe liczby.";
          return;
        }
        const drivingTime = distance / avgSpeed;
        const numStops = Math.floor(drivingTime / stopFrequency);
        const stopTime = (numStops * stopDuration) / 60;
        const totalTime = drivingTime + stopTime;
        resultElement.innerText = `Czas jazdy: ${drivingTime.toFixed(2)} godzin, z ${numStops} postojami. Całkowity czas to około ${totalTime.toFixed(2)} godzin (+ trochę ekstra na zabawne niespodzianki)!`;
      },

      farmAnimals: function(problemId) {
        const goats = parseInt(document.getElementById('goats').value);
        const sheep = parseInt(document.getElementById('sheep').value);
        const chickens = parseInt(document.getElementById('chickens').value);
        const resultElement = document.getElementById('legResult');

        if (isNaN(goats) || isNaN(sheep) || isNaN(chickens)) {
          resultElement.innerText = "Proszę podać prawidłowe liczby.";
          return;
        }
        const totalLegs = goats * 4 + sheep * 4 + chickens * 2;
        let message = `Łącznie nóg: ${totalLegs}. `;
        message += (totalLegs === 100) ? "Wspaniale! To działa!" : "Hmm... To nie daje 100 nóg.";
        resultElement.innerText = message;
      },

      cookies: function(problemId) {
        const totalCookies = 24;
        const part = totalCookies / 3;
        const oatmeal = part;
        const chocolateChip = 2 * part;
        const resultElement = document.getElementById('cookieResult');
        resultElement.innerText = `Owsiane z rodzynkami: ${oatmeal} ciasteczek, Z kawałkami czekolady: ${chocolateChip} ciasteczek.`;
      },

      garden: function(problemId) {
        const length = parseFloat(document.getElementById('gardenLength').value);
        const width = parseFloat(document.getElementById('gardenWidth').value);
        const r = parseFloat(document.getElementById('flowerRadius').value);
        const resultElement = document.getElementById('gardenResult');

        if (isNaN(length) || isNaN(width) || isNaN(r) || length <= 0 || width <= 0 || r <= 0) {
          resultElement.innerText = "Proszę podać prawidłowe liczby dodatnie.";
          return;
        }
        const totalArea = length * width;
        const flowerArea = (Math.PI * r * r) / 4;
        const vegArea = totalArea - flowerArea;
        resultElement.innerText = `Cały ogród ma ${totalArea.toFixed(2)} m², kwietnik ma ${flowerArea.toFixed(2)} m², więc zostaje ${vegArea.toFixed(2)} m² na warzywa!`;
      },

      faucet: function(problemId) {
        const dripTime = parseFloat(document.getElementById('dripTime').value);
        const resultElement = document.getElementById('faucetResult');

        if (isNaN(dripTime) || dripTime <= 0) {
          resultElement.innerText = "Proszę podać prawidłowy czas.";
          return;
        }
        const rate = 100 / dripTime;
        const dailyVolume = rate * 60 * 60 * 24;
        resultElement.innerText = `Około ${dailyVolume.toFixed(0)} ml wody jest marnowane każdego dnia!`;
      }
    };

    // Generate HTML for a single problem
    function generateProblemHTML(problem, index) {
      const headingId = `heading${problem.id}`;
      const collapseId = `problem${problem.id}`;

      let html = `
        <div class="accordion-item problem-card">
          <h2 class="accordion-header" id="${headingId}">
            <button class="accordion-button collapsed problem-header ${problem.colorClass}" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="false" aria-controls="${collapseId}">
              Zadanie ${problem.id}: ${problem.title}
            </button>
          </h2>
          <div id="${collapseId}" class="accordion-collapse collapse" aria-labelledby="${headingId}" data-bs-parent="#problemsAccordion">
            <div class="accordion-body">
              <p><strong>Treść zadania:</strong> ${problem.statement}</p>

              <!-- Help Buttons -->
              <div class="help-buttons">
                <button class="btn btn-info btn-sm" onclick="toggleContent('tips${problem.id}')">Wskazówki</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleContent('solutions${problem.id}')">Rozwiązania</button>
              </div>

              <!-- Tips Section -->
              <div id="tips${problem.id}" class="help-section">
                <p><strong>Pomyśl o tym:</strong></p>
                <ul>
                  ${problem.tips.map(tip => `<li>${tip}</li>`).join('')}
                </ul>
              </div>

              <!-- Solutions Section -->
              <div id="solutions${problem.id}" class="help-section">
                <p><strong>Możliwe pomysły:</strong></p>
                <ul>
                  ${problem.solutions.map(solution => `<li>${solution}</li>`).join('')}
                </ul>
              </div>

              ${problem.hint ? `<p><em>${problem.hint}</em></p>` : ''}

              ${problem.interactive ? generateInteractiveHTML(problem) : ''}
            </div>
          </div>
        </div>
      `;

      return html;
    }

    // Generate HTML for interactive elements
    function generateInteractiveHTML(problem) {
      if (!problem.interactive) return '';

      const interactive = problem.interactive;
      let html = '';

      // Generate input fields if they exist
      if (interactive.inputs && interactive.inputs.length > 0) {
        interactive.inputs.forEach(input => {
          html += `
            <div class="mb-3">
              <label for="${input.id}" class="form-label">${input.label}</label>
              <input type="${input.type}" class="form-control interactive-input" id="${input.id}" value="${input.defaultValue}">
            </div>
          `;
        });
      }

      // Generate button
      html += `
        <button class="btn btn-primary" onclick="calculators.${interactive.type}(${problem.id})">${interactive.buttonText}</button>
        <p id="${interactive.resultId}" class="mt-2"></p>
      `;

      return html;
    }

    // Load and render problems from JSON
    async function loadProblems() {
      try {
        const response = await fetch('problems.json');
        const data = await response.json();

        // Set page title and description
        document.getElementById('pageTitle').innerText = data.pageTitle;
        document.getElementById('pageDescription').innerText = data.pageDescription;
        document.title = data.pageTitle;

        // Generate problems HTML
        const accordion = document.getElementById('problemsAccordion');
        accordion.innerHTML = data.problems.map((problem, index) =>
          generateProblemHTML(problem, index)
        ).join('');

      } catch (error) {
        console.error('Error loading problems:', error);
        document.getElementById('pageTitle').innerText = 'Błąd wczytywania zadań';
        document.getElementById('pageDescription').innerText = 'Nie udało się wczytać zadań. Spróbuj odświeżyć stronę.';
      }
    }

    // Load problems when page is ready
    document.addEventListener('DOMContentLoaded', loadProblems);
  </script>
</body>
</html>
